services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "tiny10"
      RAM_SIZE: "3G"
      CPU_CORES: "2"
      DISK_SIZE: "32G"
      USERNAME: "user"
      PASSWORD: "password"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389
    volumes:
      - windows-data:/storage
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  windows-data:
